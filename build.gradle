plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = 'first.carbon'
base.archivesName = 'carbon'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

loom {
    accessWidenerPath = file('src/main/resources/carbon.accesswidener')
    runs {
        configureEach { ideConfigGenerated = false }
        remove server
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    smoketest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations { productionRuntimeMods { transitive = false } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // 生产环境测试模组：默认取自 Maven；-PpackMods=<目录> 改用指定目录中的渲染相关模组
    if (project.hasProperty('packMods')) {
        productionRuntimeMods fileTree(file(findProperty('packMods'))) { include 'fabric-api-*.jar', '*sodium-fabric-*.jar', '*iris-fabric-*.jar', '*ImmediatelyFast-*.jar', '*entityculling-*.jar', '*moreculling-*.jar', '*cloth-config-*.jar', '*BadOptimizations-*.jar', '*modmenu-*.jar' }
    } else {
        productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
        productionRuntimeMods "com.terraformersmc:modmenu:${modmenu_version}"
        productionRuntimeMods "maven.modrinth:sodium:${sodium_version}"
        productionRuntimeMods "maven.modrinth:iris:${iris_version}"
    }
}

// 以生产环境 Jar 启动客户端，用于验证 Sodium / Iris 联动。
// 冒烟测试模组仅用于 prodClient，不进入发布 Jar。
def smoketestJar = tasks.register('smoketestJar', Jar) {
    from sourceSets.smoketest.output
    archiveClassifier = 'smoketest-dev'
}
def remapSmoketestJar = tasks.register('remapSmoketestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = smoketestJar.flatMap { it.archiveFile }
    archiveClassifier = 'smoketest'
}

tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.productionRuntimeMods)
    if (project.hasProperty('smokeTest')) mods.from(remapSmoketestJar)
    if (project.hasProperty('noTranslucent')) jvmArgs.add('-Dcarbon.smoke.noTranslucent=true')
    // -PsmokeCompat：依次开启其他模组改写掉落物的选项，确认专用管线让位
    if (project.hasProperty('smokeCompat')) jvmArgs.add('-Dcarbon.smoke.compat=true')
    // -PsmokeStress=<秒>：反复切换物理化与总开关，促使 JIT 重新编译绘制路径
    if (project.hasProperty('smokeStress')) jvmArgs.add('-Dcarbon.smoke.stress=' + findProperty('smokeStress'))
    // -PextraMods=<目录>：额外加载该目录中的全部 Jar（兼容性测试用）
    if (project.hasProperty('extraMods')) mods.from(fileTree(file(findProperty('extraMods'))) { include '*.jar' })
    if (project.hasProperty('prodJvmArgs')) jvmArgs.addAll(findProperty('prodJvmArgs').toString().split(' '))
    // -PprodJava=25：以其他 Java 版本运行（需 Gradle 能找到对应 JDK，例如 -Porg.gradle.java.installations.paths=<目录>）
    if (project.hasProperty('prodJava')) javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(findProperty('prodJava').toString().toInteger()) }
    runDir = file('run-prod')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from 'LICENSE' }

// 在整合包隔离副本中对比帧率：-PbenchDir=<目录> -PbenchItems=1000 -PbenchSeconds=15 -PbenchPhases=... 可调整
tasks.register('benchPack', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // 整合包模组与配置需预先复制到 benchDir（模组用 ASCII 文件名放入 mods，含 emoji 的文件名无法经启动参数传递）
    mods.from(remapSmoketestJar)
    runDir = file(findProperty('benchDir') ?: 'run-bench')
    jvmArgs.addAll('-Xmx6G', '--add-modules', 'jdk.incubator.vector', '--enable-preview', '-XX:+ExplicitGCInvokesConcurrent', '-Dcarbon.bench=true',
            "-Dcarbon.bench.items=${findProperty('benchItems') ?: 1000}", "-Dcarbon.bench.seconds=${findProperty('benchSeconds') ?: 15}")
    if (project.hasProperty('benchPhases')) jvmArgs.add("-Dcarbon.bench.phases=${findProperty('benchPhases')}")
    // 追加的 JVM 参数排在默认参数之后，可覆盖 -Xmx 等设置，例如 -PbenchJvm="-Xmx3072m -Xmn460m"
    if (project.hasProperty('benchJvm')) jvmArgs.addAll(findProperty('benchJvm').toString().split(' ').findAll { it })
    if (project.hasProperty('benchJfr')) jvmArgs.addAll("-XX:FlightRecorderOptions=repository=${file('build/jfr')}", "-XX:StartFlightRecording=settings=profile,name=carbon")
}
