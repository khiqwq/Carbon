plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = 'first.carbon'
base.archivesName = 'carbon'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

loom {
    accessWidenerPath = file('src/main/resources/carbon.accesswidener')
    runs {
        configureEach { ideConfigGenerated = false }
        remove server
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    smoketest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations { productionRuntimeMods { transitive = false } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionRuntimeMods "com.terraformersmc:modmenu:${modmenu_version}"
    productionRuntimeMods "maven.modrinth:sodium:${sodium_version}"
    productionRuntimeMods "maven.modrinth:iris:${iris_version}"
}

// 以生产环境 Jar 启动客户端，用于验证 Sodium / Iris 联动。
// 冒烟测试模组仅用于 prodClient，不进入发布 Jar。
def smoketestJar = tasks.register('smoketestJar', Jar) {
    from sourceSets.smoketest.output
    archiveClassifier = 'smoketest-dev'
}
def remapSmoketestJar = tasks.register('remapSmoketestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = smoketestJar.flatMap { it.archiveFile }
    archiveClassifier = 'smoketest'
}

tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.productionRuntimeMods)
    if (project.hasProperty('smokeTest')) mods.from(remapSmoketestJar)
    if (project.hasProperty('noTranslucent')) jvmArgs.add('-Dcarbon.smoke.noTranslucent=true')
    runDir = file('run-prod')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from 'LICENSE' }
